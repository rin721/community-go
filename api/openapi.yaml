                    description: 请求过多，请稍后重试。
                    headers:
                        Retry-After:
                            description: 建议客户端等待的秒数。
                            schema:
                                minimum: 1
                                type: integer
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 服务内部错误。
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 服务暂不可用，请稍后重试。
                    headers:
                        Retry-After:
                            description: 建议客户端等待的秒数。
                            schema:
                                minimum: 1
                                type: integer
                "504":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: 上游请求超时。
                default:
                    content:
                        application/problem+json:
                            schema:
