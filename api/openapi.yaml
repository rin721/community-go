components:
    schemas:
        CreateTodoRequest:
            additionalProperties: false
            description: 创建 Todo 的请求体。
            properties:
                title:
                    description: Todo 标题，去除首尾空白后必填。
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - title
            type: object
        IAMAccount:
            additionalProperties: false
            properties:
                displayName:
                    type: string
                id:
                    type: string
                mustChangePassword:
                    type: boolean
                securityRevision:
                    format: int64
                    type: integer
                status:
                    enum:
                        - active
                        - disabled
                    type: string
                username:
                    type: string
                version:
                    format: int64
                    type: integer
            required:
                - id
                - username
                - displayName
                - status
                - mustChangePassword
                - securityRevision
                - version
            type: object
        IAMIdentity:
            additionalProperties: false
            properties:
                accountId:
                    type: string
                displayName:
                    type: string
                mustChangePassword:
                    type: boolean
                permissions:
                    items:
                        type: string
                    type: array
                securityRevision:
                    format: int64
                    type: integer
                username:
                    type: string
            required:
                - accountId
                - username
                - displayName
                - permissions
                - mustChangePassword
                - securityRevision
            type: object
        IAMRole:
            additionalProperties: false
            properties:
                active:
                    type: boolean
                archived:
                    type: boolean
                code:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                system:
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - id
                - code
                - name
                - active
                - archived
                - system
                - version
            type: object
        IAMSession:
            additionalProperties: false
            properties:
                absoluteExpiresAt:
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                csrfToken:
                    type: string
                identity:
                    $ref: '#/components/schemas/IAMIdentity'
                idleExpiresAt:
                    format: date-time
                    type: string
            required:
                - identity
                - csrfToken
                - createdAt
                - idleExpiresAt
                - absoluteExpiresAt
            type: object
        Problem:
            additionalProperties: false
            description: RFC 9457 Problem Details。
            properties:
                code:
                    description: 稳定机器可读错误码。
                    pattern: ^[a-z][a-z0-9_]{0,63}$
                    type: string
                detail:
                    description: 人类可读的错误细节。
                    type: string
                instance:
                    description: 错误实例 URI-reference。
                    format: uri-reference
                    type: string
                status:
                    description: HTTP 状态码。
                    maximum: 599
                    minimum: 400
                    type: integer
                title:
                    type: string
                type:
                    description: Problem type URI-reference。
                    format: uri-reference
                    type: string
                violations:
                    items:
                        $ref: '#/components/schemas/Violation'
                    type: array
            required:
                - type
                - title
                - status
                - code
            type: object
        Todo:
            additionalProperties: false
            description: Todo 资源。
            properties:
                completedAt:
                    description: 完成时间。
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    description: 创建时间。
                    format: date-time
                    type: string
                id:
                    description: Todo 稳定 ID。
                    type: string
                status:
                    $ref: '#/components/schemas/TodoStatus'
                title:
                    description: Todo 标题。
                    type: string
                updatedAt:
                    description: 最后更新时间。
                    format: date-time
                    type: string
            required:
                - id
                - title
                - status
                - createdAt
                - updatedAt
            type: object
        TodoList:
            additionalProperties: false
            description: Todo 分页列表。
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Todo'
                    type: array
                limit:
                    minimum: 1
                    type: integer
                offset:
                    minimum: 0
                    type: integer
                total:
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - offset
                - limit
                - total
            type: object
        TodoStatus:
            description: Todo 生命周期状态。
            enum:
                - pending
                - completed
            type: string
        Violation:
            additionalProperties: false
            description: 单个字段校验失败。
            properties:
                field:
                    type: string
                reason:
                    type: string
            required:
                - field
                - reason
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
        webuiSession:
            in: cookie
            name: __Host-community-go_iam_session
            type: apiKey
info:
    description: 当前模板的公开 HTTP 契约。所有失败使用 RFC 9457 Problem Details；Todo operation 使用 bearer JWT，IAM operation 使用 none/webuiSession，并由生成的 policy inventory 驱动授权。
