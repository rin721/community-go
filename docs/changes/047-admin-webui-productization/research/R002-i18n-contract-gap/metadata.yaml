non_applicable_scenarios: ["后端 API 文案翻译", "无 WebUI Binding 的业务模块", "复制第三方后台源码"]
status: active
summary: "当前工作树已有模块 locale registry 和宿主 i18n adapter，但模块页面仍直接使用 useTranslation 并包含用户可见硬编码文案；setup 错误码映射直接返回中文文本，因此必须把 i18n 约束提升为 Binding、公开翻译 hook、message ID 和静态架构门禁组成的规范契约。"
