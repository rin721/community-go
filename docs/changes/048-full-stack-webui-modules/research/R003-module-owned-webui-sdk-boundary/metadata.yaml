applicable_scenarios: ["048 修订", "新增业务模块 WebUI", "新增 WebUI SDK capability", "Auth/Ops 收口"]
non_applicable_scenarios: ["远程微前端", "运行时插件", "社区 Nuxt frontend", "无 WebUI 的后端模块"]
status: active
summary: "保留 internal/module/<id>/binding/webui/web 的业务 owner 与构建期 SourcePath；用分层 @webui/sdk public contract 隔离 platform。普通模块 core 零修改，模块专属技术留模块，只有 host-level 新能力才单独新增 SDK interface 与 adapter。"
