title: "业务模块自有 WebUI 与 SDK 适配边界"
question: "在 WebUI 页面继续由业务模块持有的前提下，怎样保证普通新模块不修改 WebUI core，并只在真实新宿主能力出现时扩展 SDK interface/adapter？"
