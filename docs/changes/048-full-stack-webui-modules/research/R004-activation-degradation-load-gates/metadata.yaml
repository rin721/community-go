schema_version: 1
id: R004
title: "WebUI 模块启用、降级与加载门禁"
question: "怎样确保未完成、未启用、无权限或运行不可用的业务模块不会自动加载页面、locale 和查询，同时允许明确受控的降级呈现？"
research_type: architecture-decision
topics: ["module-activation", "delivery-state", "availability", "lazy-load", "locale-isolation"]
keywords: ["fail-closed", "ActivationState", "DeliveryState", "AvailabilityState", "React.lazy", "webuiLocaleRegistry"]
applicable_scenarios: ["048 修订", "新增业务模块 WebUI", "模块灰度启用", "依赖故障降级", "未完成页面隔离"]
non_applicable_scenarios: ["运行时远程插件", "Module Federation", "社区 Nuxt frontend", "后端 operation 授权替代"]
status: active
summary: "以 composition 显式选择和启用作为构建门禁，以 delivery/access/availability 作为暴露与运行门禁；未通过门禁的模块不得进入可加载 Entry/Locale 投影。宿主先判定再 lazy import，locale 与 query 也按同一快照加载并隔离失败。"
