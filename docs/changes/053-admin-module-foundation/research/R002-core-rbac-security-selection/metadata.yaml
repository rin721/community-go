schema_version: 1
id: R002
title: "Core RBAC、安全语义与策略引擎选择"
question: "账号权限首版应采用哪个 RBAC 子集，权限与 Session 变更怎样 fail closed，是否应引入 Casbin？"
research_type: technology-selection
topics: ["RBAC", "authorization", "session-security", "password", "Casbin"]
keywords: ["Core RBAC", "user-role assignment", "permission-role assignment", "deny by default", "session invalidation", "Casbin watcher"]
applicable_scenarios: ["053 权限模型", "角色权限管理", "Session 权限变更", "策略引擎选型"]
non_applicable_scenarios: ["角色继承", "职责分离", "ABAC", "多租户", "外部 IAM"]
status: active
summary: "首版采用无层级的 Core RBAC，权限只经角色授予并由服务端每请求校验；权限或密码变化撤销受影响 Session。Casbin 能执行复杂模型但不管理账号/角色实体且多实例同步需额外组件，当前精确 operation 权限场景不引入。"
