title: "组织目录与菜单管理边界"
question: "用户、部门、岗位和菜单管理怎样进入 053，同时不把数据库菜单当成页面加载器或引入未确认的数据范围授权？"
research_type: current-project
topics: ["user-management", "department", "position", "menu", "webui-catalog", "authorization"]
