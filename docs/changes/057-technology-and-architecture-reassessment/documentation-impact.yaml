schema_version: 1
change: 057-technology-and-architecture-reassessment
areas:
  - id: startup
    decision: reviewed-no-change
    reason: 已实施的 cache、AuthN 与 resilience 任务不改变应用启动、首次使用或服务入口；JWKS lifecycle 仍由原 Supervisor participant 拥有，Execution 删除无真实资源支撑的后台 goroutine 后无需新增启动步骤。
  - id: capability
    decision: updated
    documents:
      - docs/architecture/technology-selection.md
    reason: 缓存已收敛为 Redis 单一 authority；AuthN 保留 jwx/v3 与 x/crypto/argon2；Execution 已以项目契约隔离 backoff/v7，HTTP Client 已 one-shot；Serde 已迁移官方稳定 YAML v3 并删除零消费者 Codec；入口限速以项目薄边界接入 x/time/rate；CORS 已接入 rs/cors 与标准库 CrossOriginProtection。整体方案进一步确认 HTTP 采用 Huma、Data 采用 direct GORM concrete repo、HTTP instrumentation 采用 otelhttp，以及静态 Blueprint 目标；当前 authority 明确区分已实现和待实施。
  - id: module
    decision: updated
    documents:
      - internal/module/README.md
      - internal/module/auth/README.md
      - internal/module/iam/README.md
      - internal/module/todo/README.md
      - internal/kernel/app/README.md
    reason: 记录 Auth JWT/JWK 共享刷新与取消语义、IAM 凭据演进所有权、Kernel Execution 同步 memory backend 和受控 retry 观测边界；HTTP 模块现以 Huma registration 作为单一契约源。
  - id: configuration
    decision: updated
    documents:
      - docs/configuration/README.md
      - docs/operations/runtime-capabilities.md
    reason: HTTP rateLimit 增加 local/disabled 严格模式，明确数值校验、generation-local reload、management 排除和容量校准责任。
  - id: operations
    decision: updated
    documents:
      - docs/operations/runtime-capabilities.md
    reason: Execution 不再拥有 recovery/async goroutine 或 shutdown finalizer；运行矩阵改为同步 memory Store、完整 retry budget 和真实未覆盖边界；HTTP 入口保护增加成熟 token bucket 与保留的 channel overload 生命周期和验证边界。
  - id: api
    decision: updated
    documents:
      - api/README.md
    reason: Huma 已接管全部 31 个业务 operation 的 typed binding、validation、OpenAPI 与 route registration；项目 OperationGate、Problem 和 operation/policy ownership 保持边界，旧 DSL、dispatcher 与重复 validation 已删除。
  - id: architecture
    decision: updated
    documents:
      - docs/architecture/technology-selection.md
      - docs/development/application-module-development.md
      - docs/changes/057-technology-and-architecture-reassessment/README.md
      - docs/changes/057-technology-and-architecture-reassessment/design.md
      - docs/changes/057-technology-and-architecture-reassessment/tasks.md
    reason: R008-R013 已冻结 Config、HTTP、Data、Security、Observability 与 owner/reload 的采用/拒绝结论、接入边界、单轨删除范围和实施依赖；静态 Blueprint 明确为首个架构切片。
  - id: documentation
    decision: reviewed-no-change
    reason: docs-guard 仅迁移同一 YAML v3 API 的官方 module path，文档治理 schema、扫描范围和失败语义均未改变。
