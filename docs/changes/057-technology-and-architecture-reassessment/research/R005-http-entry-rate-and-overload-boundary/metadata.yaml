schema_version: 1
id: R005
title: "HTTP 入口速率与过载保护边界复核"
question: "当前 HTTP token bucket、并发门禁、配置和 Generation 生命周期的真实语义是什么；哪些通用算法应替换，哪些简单项目策略应保留？"
research_type: current-project-and-external-primary-source
topics: ["HTTP", "rate limiting", "load shedding", "overload", "configuration", "generation lifecycle"]
keywords: ["RateLimiter", "OverloadLimiter", "x/time/rate", "x/sync/semaphore", "429", "503", "Retry-After", "Application Generation"]
technologies: ["golang.org/x/time/rate", "golang.org/x/sync/semaphore", "net/http", "chi"]
applicable_scenarios: ["LIMIT-057-001", "HTTP 入口保护", "单进程 load shedding", "限流配置"]
non_applicable_scenarios: ["按用户或租户计费配额", "登录防爆破", "跨副本一致限流", "网关或 CDN 防护", "出站重试和熔断"]
status: active
summary: "当前自研 token bucket 应由 x/time/rate v0.15.0 替换，但项目继续拥有 fail-fast HTTP 语义。现有 channel semaphore 精确表达非阻塞 503 且无需机械换库。限流保持 generation-local、单进程入口保护，并以显式 local/disabled 模式消除 0/0 实际回落默认值的配置歧义。"
