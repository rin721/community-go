schema_version: 1
id: R006
title: "认证库与凭据校验边界复核"
question: "当前 JWT/JWK 与 Argon2id 实现是否应迁移到新的第三方库；怎样同时满足成熟主流、资源安全、取消语义和凭据演进要求？"
research_type: current-project-and-external-primary-source
topics: ["authentication", "JWT", "JWK", "password hashing", "Argon2id", "credential migration"]
keywords: ["jwx/v3", "jwx/v4", "x/crypto/argon2", "PHC", "NeedsRehash", "context cancellation", "CredentialVerifier"]
technologies: ["github.com/lestrrat-go/jwx/v3", "github.com/lestrrat-go/jwx/v4", "golang.org/x/crypto/argon2", "github.com/alexedwards/argon2id", "github.com/matthewhartstonge/argon2"]
applicable_scenarios: ["AUTHN-057-001", "Bearer JWT/JWK 校验", "本地密码哈希与渐进重哈希"]
non_applicable_scenarios: ["OIDC 登录流程", "外部身份提供商 discovery", "授权策略引擎", "MFA", "API key"]
status: active
summary: "保留成熟且活跃维护的 jwx/v3 与 Go 官方 x/crypto/argon2，不迁移到仍要求 GOEXPERIMENT=jsonv2 的 jwx/v4，也不引入维护或资源边界不足的高层 Argon2 Wrapper。项目只拥有窄认证契约、JWK 生命周期、安全校验、受限 PHC 格式策略和 NeedsRehash，不自行实现 JOSE 或密码学算法。"
