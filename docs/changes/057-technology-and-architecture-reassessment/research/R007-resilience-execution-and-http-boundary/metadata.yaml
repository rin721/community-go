status: active
summary: "采用成熟且窄的 cenkalti/backoff/v7 承担 Execution 退避与重试循环，项目拥有命名 profile、幂等、错误分类、attempt/total budget 和观测；删除无消费者的自研 breaker、HTTP 通用隐式重试，以及没有真实外部主存储支撑的 RecoveringStore/AsyncRecorder。failsafe-go 活跃但 pre-v1 且范围过宽，gobreaker/v2 成熟但当前没有真实 failure domain，均不在本轮引入。"
