question: "当前 CORS、安全响应头、Same-Origin 与 CSRF 的职责是否应由 rs/cors、unrolled/secure 或 Go CrossOriginProtection 替换，哪些项目语义必须保留？"
research_type: current-project-and-external-primary-source
topics: ["CORS", "CSRF", "security headers", "browser security", "HTTP middleware"]
keywords: ["SecureHeaders", "CORS", "SameOrigin", "CrossOriginProtection", "rs/cors", "unrolled/secure"]
technologies: ["github.com/rs/cors", "net/http.CrossOriginProtection", "github.com/unrolled/secure"]
applicable_scenarios: ["SEC-057-002", "HTTP browser boundary", "WebUI Session", "cross-origin API"]
non_applicable_scenarios: ["JWT validation", "password hashing", "WAF/CDN", "TLS termination configuration"]
status: active
summary: "采用 rs/cors v1.11.1 处理标准 CORS headers/Vary/preflight，并用 Go CrossOriginProtection 加固 unsafe cross-site 请求；项目保留 fail-closed allowlist、Problem、IAM Session CSRF token 与严格 Origin。安全头继续显式保留，不引入 unrolled/secure。"
