status: active
summary: "当前 IAM 关系表、owner、Session revision 与事务撤销是唯一业务 authority；IAM 每请求手写展开权限并经 composition 转为 Principal.Scopes，Auth 再手写精确集合判断。现有显式 composition 可承载窄 DecisionPoint 注入，但 Kernel Binding 只属构建期，request context 也不应携带服务。"
