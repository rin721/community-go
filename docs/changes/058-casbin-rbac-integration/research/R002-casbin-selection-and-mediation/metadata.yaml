status: active
summary: "采用 Apache Casbin v3.10.0 core SyncedEnforcer 作为 IAM 内存 evaluator；拒绝 gorm-adapter/casbin_rule、AutoLoad、Watcher 与 Casbin Management API 写入。IAM transaction 产出稳定 policy snapshot 与 revision，Auth 通过 composition 注入的 DecisionPoint 消费，revision 不匹配同步刷新且失败关闭。"
