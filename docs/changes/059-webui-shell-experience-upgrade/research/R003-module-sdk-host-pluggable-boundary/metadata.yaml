title: "模块、SDK 与 WebUI Host 可插拔边界"
question: "当前业务页面、项目自有 SDK、WebUI Host、Binding/codegen 之间的真实 owner 与通信链路是什么，059 应如何升级页面体验而不破坏模块化和可插拔设计？"
research_type: current-project
topics: ["webui", "module-owned-page", "sdk-contract", "host-adapter", "binding", "generated-registry", "pluggability", "lazy-loading", "performance"]
