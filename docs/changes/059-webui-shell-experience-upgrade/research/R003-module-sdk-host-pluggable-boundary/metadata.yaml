applicable_scenarios: ["WebUI Shell 重构", "模块页面视觉升级", "普通模块接入", "SDK 能力演进", "静态可插拔验证"]
non_applicable_scenarios: ["运行时远程插件", "Module Federation", "独立前端发布", "业务 API 改造"]
status: active
summary: "当前页面已经由业务模块持有，并通过 Binding、generated lazy registry、Manifest 和 @webui/sdk/* 与 Host 装配；059 必须保留这一 A/契约/B 边界，只在模块 owner 内升级业务页面，在 Host 内升级 Shell/adapter，并把可插拔限定为当前已实现的源码与构建期静态装配，同时保持按路由 code splitting 而不引入热插拔。"
