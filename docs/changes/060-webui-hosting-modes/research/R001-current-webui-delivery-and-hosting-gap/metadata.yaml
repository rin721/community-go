title: "当前 WebUI 交付链与 Go 服务托管缺口"
question: "当前 WebUI 构建产物由谁产出与消费，Go Service 是否有静态托管能力，前后端分离模式依赖哪些机制，新增托管模式会触碰哪些现有契约？"
