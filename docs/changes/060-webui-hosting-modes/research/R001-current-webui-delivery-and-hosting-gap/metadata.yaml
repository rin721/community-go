applicable_scenarios: ["为当前仓库设计 Go 服务托管 WebUI 的单进程模式"]
non_applicable_scenarios: ["多前端根场景", "子路径部署", "runtime 镜像内运行 node", "运行期热更新构建产物"]
status: active
summary: "当前 webui/dist 仅由本地 Vite build 产出、Docker/release 均不托管；Go 业务 Router 无任何静态能力，且 AcceptJSON 中间件会误伤浏览器静态请求；同源模式下 CORS/Origin/Session 语义可复用，需文档化 Secure Cookie 的 loopback/TLS 前提。"
