summary: "模式 B 的业务 listener 从不挂载 /management（024 OPS-REQ-001 与 060 延续），/management 前缀在 SPA 处理器中被排除并返回 JSON 404；而 Ops 页面（internal/module/ops/binding/webui/web）硬编码 /management/* 同源请求，因此默认启动下四个必需探针全部 404；模式 A 依赖 Vite `/management` 代理去前缀转发到 9090 才可用。060 E2E 把 managementStatus=404 当作期望断言，首次暴露该功能缺口。"
