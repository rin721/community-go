title: "Ops 页面 management 数据通路与默认启动 4xx 根因"
question: "默认启动（模式 B：Go 服务托管 WebUI）下，为何 Ops `运行状态`/`能力清单` 页请求 /management/* 一直 4xx？两种模式的 management 数据通路分别是什么？WebUI 在没有真实 management 数据的环境（mock/静态预览）应如何表现？"
