schema_version: 1
id: R062-001
title: "当前 WebUI 骨架、注入面、导航与交互规范的事实与差距"
question: "用户要求建立以「骨架 + 注入点」为核心的 Web UI 设计体系：业务模块除页面外还要承载多级导航与 Shell 布局衔接（菜单图标、层级缩进、激活态），骨架各核心区域（顶栏、侧边栏、内容容器、页头、标签页栏、底部状态栏）都要有统一注入钩子，全部可交互元素要有统一状态链（悬停/点击/禁用/加载/成功失败）与权限控制。当前 WebUI 的注入面、骨架分区、导航能力和交互契约分别处于什么状态，差距在哪里？"
research_type: current-project
topics: ["webui", "shell", "binding", "manifest", "navigation", "interaction", "permission", "sdk-ui", "registry-generation"]
keywords: ["webui.Binding", "Manifest", "ViewOperationID", "NavigationPolicy", "SidebarMenu", "AppHeader", "WorkspaceTabs", "ActionTrigger", "iconId", "scopes"]
applicable_scenarios:
  - "为当前仓库设计骨架分区与类型化注入点体系"
  - "评审交互元素状态链与动作级权限的呈现契约"
  - "评估多级导航、图标目录和层级缩进是否需要升级"
  - "评估轻量接入（新模块声明注入面不改宿主）的目标是否在现有结构上可达"
non_applicable_scenarios:
  - "运行时下载/热安装远程模块或动态插件（048/056/059 已明确排除）"
  - "改变服务端授权模型或把呈现权限冒充真实授权"
  - "为未来微前端或多前端独立发布设计承载（不在本变更范围）"
status: active
summary: "当前 WebUI 只是 route（内容区页面）+ menu（导航）+ locale + mock 四类静态注入面，且 route 仅 app/blank 两种布局、menu 图标目录硬编码两个 icon、页面交互全部手写 useState 且无统一 pending/禁用/反馈状态链、无动作级权限投影（只有 route 级 ViewOperationID）。骨架分区组件（AppSidebar/AppHeader/WorkspaceTabs/Footer）已存在但没有类型化注入点，PageHeader/DataToolbar 等原语已具备但缺少 zone 化与交互契约。差距是结构性的：需要把单一注入面升级为分区注入点模型，并补齐交互状态链与动作权限契约；静态插拔主线无需改变。"
