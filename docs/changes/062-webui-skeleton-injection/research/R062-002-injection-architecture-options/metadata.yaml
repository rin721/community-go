schema_version: 1
id: R062-002
title: "「骨架 + 注入点」承载架构与候选对比（自研扩展 vs 微前端运行时 vs headless 交互库）"
question: "把当前 WebUI 从「route/menu/locale/mock 四类注入面」升级为「分区骨架 + 类型化注入点 + 统一交互/权限契约」时，应当继续扩展现有自研静态插拔机制，还是引入成熟第三方（微前端运行时：single-spa/qiankun/Module Federation；无头交互组件：Radix/headless-ui/shadcn；CSS 体系：Tailwind）？结论的收益、边界和验证证据是什么？"
research_type: external-comparison
topics: ["webui", "micro-frontend", "plugin-architecture", "headless-components", "design-system", "static-pluggability", "architecture-assessment"]
keywords: ["module federation", "single-spa", "qiankun", "radix ui", "headless ui", "shadcn", "tailwind", "runtime-plugin", "generated registry", "manifest"]
applicable_scenarios:
  - "评估当前自研静态插拔机制是否需要被成熟方案替换"
  - "评估骨架注入点采用 typed facets 而非万能容器/Service Locator"
  - "评估交互状态链是否引入无头组件库或以项目自有原语 + APG 对齐实现"
non_applicable_scenarios:
  - "把运行时远程模块、热安装、多前端独立发布作为本次目标"
  - "为不存在真实用例的跨模块 UI 复用提前抽象"
  - "以流行度或示例数量代替收益判断"
status: active
summary: "结论为「保留并演进自研静态插拔机制（单轨）」，并借用成熟无头组件与 WAI-ARIA APG 的交互状态模式作为行为契约参考（不作为依赖）。微前端运行时（single-spa/qiankun/Module Federation）与项目多个已确认边界（048 否决目录扫描与运行时远程模块、056 否决第二套路由与动态页面、059 否决运行时插件与 UI 运行时）直接冲突，引入它们需要重建签名/CSP/版本协商/资源隔离，纯属为未立项目标付成本；headless 库（Radix/headless-ui）解决的是对话框/菜单/聚焦管理的通用模式，而宿主已在这些细节上完成 059 收口，引入价值是模式参考而非代码复用；Tailwind 已在 059 明确否决。typed facets + 生成 registry + Manifest 投影是现有结构的自然扩展，工作量可控、与质量链（architecture lint/generate:check/E2E/视觉）闭环兼容。"
