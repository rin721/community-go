title: "账号与权限体系当前能力边界、已知缺口与进阶候选方向"
question: "当前账号与权限体系（IAM 身份凭据会话 + Auth 授权审计 + Organization 组织目录 + Navigation 菜单策略 + Permission Catalog + WebUI 权限呈现）的真实能力边界是什么；已有研究与代码把哪些能力标记为缺口或未来项；用户要求对体系进阶设计时，候选方向各自的适用性、耦合面与验证路径如何？"
research_type: current-project
topics: ["iam", "auth", "rbac", "organization", "permission", "session", "audit", "webui"]
keywords: ["Account", "Credential", "Session", "Casbin", "DecisionPoint", "PermissionKey", "数据权限", "审计", "多因素", "密码策略"]
applicable_scenarios: ["账号与权限体系进阶设计", "新增安全策略（密码/会话/多因素）", "数据权限或对象级授权", "可查询审计", "端点/操作管理"]
non_applicable_scenarios: ["多租户", "外部 IAM/SSO/OIDC 首发接入", "微服务拆分", "运行时动态加载权限模型", "把前端权限误当作授权"]
status: active
summary: "当前体系已闭环 Core RBAC（Casbin evaluator + authorization revision + 乐观并发关系替换）、有状态 Session（安全修订撤销/锁定/禁用）、owner 不变量、低敏审计日志与组织目录（组织关系不进入授权决策）。既有研究多次把部门数据权限、角色层级/deny/ABAC、可查询审计、MFA/TOTP、外部身份接入标记为“需新需求再评估”的未来项；进阶设计应把这些候选按真实收益、模块边界与验证成本分层，避免无收益扩界。"
