id: R065-001
title: "日志与审计体系当前能力、缺口与进阶候选方向"
question: "当前日志体系（pkg/logger + 运行事件）与审计体系（064 已实施的 Auth 授权决策审计）的真实能力边界是什么；用户要求深度研究并新增『日志与审计体系等业务模块』方案时，哪些能力是真实缺口、哪些是无收益扩界；业务模块（IAM/Organization/Navigation）的写操作是否有可审计路径，进阶应落在哪些模块边界内？"
research_type: current-project
topics: ["logging", "audit", "observability", "operation-audit", "log-query", "business-module"]
keywords: ["pkg/logger", "AuditSink", "AuditEvent", "auth_audit_events", "操作审计", "审计查询", "业务写操作", "log query"]
applicable_scenarios: ["日志与审计体系进阶设计", "业务操作审计（activity/operation audit）", "审计查询增强", "日志规范与审计规范统一", "审计保留/导出边界"]
non_applicable_scenarios: ["外部日志平台（Loki/ELK/Splunk）", "OTLP Logs", "日志轮转方案", "分布式 tracing 后端", "SIEM/异地审计聚合"]
status: active
summary: "日志体系已闭环（pkg/logger + 041 治理 + HTTP/Auth/migration/scheduler/messaging 事件），但只有 sink 写入、无查询 API；审计体系在 064 已落地 Auth 授权决策审计（auth_audit_events + 查询 + WebUI），但仅覆盖授权决策，业务写操作（IAM 账号/角色/权限、Organization 部门/岗位/分配、Navigation 菜单策略变更）没有任何操作审计痕迹；既有 024/R005 决策为审计收口 Auth。进阶候选：业务操作审计（借 port 注入同一低敏审计面）、审计规范 authority、查询增强；日志自建查询属无收益扩界，外部日志平台保持非目标。"
