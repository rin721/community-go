summary: "核心 Core RBAC 闭环（账号-角色-权限键-Casbin 求值-revision 失效-WebUI 投影）已完整且文档与代码一致；缺口集中在：账号无资料更新与删除（含归档）；角色无更新/启停/归档；WebUI 按钮级权限机制（ActionTrigger/ActionPermissions）存在但 iam/org/nav 管理页未接入；各列表无查询/过滤/分页；409 冲突无差异确认 UI；分配页无乐观锁；部门树非可折叠控件。数据权限（部门数据范围）完全缺失，055/064 已明确为重大边界突破需单独确认；角色-菜单显式绑定与动态菜单与 056/058 边界冲突。账号 Archived 字段缺失（需迁移），角色/部门/岗位已有 Archived 字段但无 service 方法，均为 IAM/Organization 边界内的自然延伸缺口。"
