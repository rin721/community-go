question: "当前账号与权限体系（IAM + Auth + Organization + Navigation + Permission Catalog + WebUI）相对「用户管理/角色管理/菜单与权限管理/部门与岗位管理」四要素闭环，逐项缺口是什么；各缺口的模块归属、实现边界（可直接补齐 vs 需边界突破）与补齐路径如何？"
research_type: current-project
