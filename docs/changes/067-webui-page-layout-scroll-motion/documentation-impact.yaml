    reason: 宿主 boot 装配链（manifest -> registry -> Shell -> route）与 revision 门禁不变；Lenis/Reveal 只作用于浏览器呈现层，不引入新启动阶段。
  - id: module
    decision: updated
    documents:
      - internal/module/organization/binding/webui/web/locale/zh-CN.json
      - internal/module/organization/binding/webui/web/locale/en-US.json
      - internal/module/{iam,organization,auth,navigation,ops}/binding/webui/web/*.tsx
      - internal/module/{iam,organization,auth,navigation,ops}/binding/webui/web/*.module.css
