  - id: webui
    decision: updated
    documents:
      - docs/development/webui.md
      - webui/README.md
      - webui/package.json
      - webui/pnpm-lock.yaml
    reason: 新增平台布局骨架原语（PageSection/StatGrid/StatCard/DataCard/Reveal 等）、滚动体验运行时（Lenis 封装、边缘阻尼、磁吸、劫持、滚动条插槽）、ThemePreferences experience 派生配置与 ThemeDrawer 体验面板；新增唯一第三方依赖 lenis 并记录维护/边界结论；样式 authority 仍为 webui/src/styles.css。
  - id: api
    decision: reviewed-no-change
    reason: api/openapi.yaml 与 operation inventory 不变；不新增 HTTP operation；动作权限钩子沿用既有 OperationID。
  - id: operations
    decision: updated
    documents:
      - docs/architecture/technology-selection.md
    reason: 新增第三方 lenis 的引入结论与封装边界记录到技术选型 authority；构建/容器/部署/安全边界不变。