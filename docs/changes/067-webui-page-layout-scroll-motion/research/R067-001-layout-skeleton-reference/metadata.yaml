title: "组织模块报错事实、TailAdmin 布局骨架与现有业务页面结构差距"
question: "用户报告「组织管理及下级模块在 Web UI 页面中存在报错」，并要求「参照 react-demo.tailadmin.com 重构全部业务模块 Web UI 页面布局骨架」：（a）组织模块及其下级页面的报错具体是什么、文件位置与根因？（b）TailAdmin 的布局骨架由哪些区域与卡片形态组成？（c）当前全部业务模块页面的结构与平台样式 authority 约束下，差距与最小改法是什么？"
