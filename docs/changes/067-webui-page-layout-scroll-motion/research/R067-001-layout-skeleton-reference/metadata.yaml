status: active
summary: "组织模块页面的可见报错根因是 AssignmentsPage.tsx 使用了 webui.organization.assignments.saved/conflict/revision 三个翻译键，而 locale 资源（en-US/zh-CN）只有无 assignments. 前缀的 webui.organization.saved/conflict/revision；i18n later，keySeparator/nsSeparator 关闭，缺失键被 parseMissingKeyHandler 替换为宿主「翻译资源缺失」，用户因此在分配页看到占位错误文案。另发现 Departments/Positions/Assignments 的创建/更新操作没有捕获 Promise 拒绝，失败时控制台报 unhandled rejection 且页面无反馈。布局方面：现有页面是 PageHeader + Surface(toolbar) + admin-grid 扁平卡片，各模块在自身 CSS Module 中重复定义近似 layout 规则（toolbar/admin-grid/admin-card/admin-meta/management-panel 等）；对照 TailAdmin 的「统计卡行 + 标题卡片 + 表格卡片 + 页脚分页」骨架，差距是平台缺少统一的区块卡片（section-card）、统计行（stat-grid）与表格卡片（data-card）原语，模块各自为政。"
