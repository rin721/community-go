title: "全局菜单改为两级：顶级「设置」，移除管理中心宿主分组层"
question: "用户要求：将「管理中心」改为「设置」，全局菜单只存在两级（顶级设置 + 分区子项），不要三级。当前（070/072）层级为 host.center（管理中心）→ settings.center（设置）→ 五子项（profile/account/security/appearance/notifications）＝三级。需要回答：(a) 当前三级链在 composition/settings binding/locale/测试/e2e 中的落点；(b) 改为两级的最小改动（settings.center 顶级、host.center 不再装配、locale 键清理、断言更新）。"
research_type: current-project
topics: ["webui", "menu-hierarchy", "settings", "host-navigation", "two-level"]
keywords: ["host.center", "settings.center", "Management center", "settings", "两级菜单"]
applicable_scenarios:
  - "全局菜单收敛为两级（设置 → 五分区）"
  - "宿主分组 host.center 不再装配（HostNavigation 能力保留）"
non_applicable_scenarios:
