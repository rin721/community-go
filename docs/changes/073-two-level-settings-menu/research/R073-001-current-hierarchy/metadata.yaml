status: active
summary: "当前（072，提交 7f888a4）：composition applicationWebUIHostNavigation() 装配 host.center（Management center，落地 settings.profile）；settings binding settings.center ParentID=host.center，下设五子项；host locale 键 webui.host.navigation.center.title（en/zh）；webui_registry_test 断言 host.center→settings.center 边；e2e 070 断言侧栏 'Management center'+'Settings'+Account security、059 用 Expand submenu first()。改为两级：settings.center 去掉 ParentID（顶级组，title 已是 'Settings'）；composition 不再装配 host.center（HostNavigation 契约能力保留在 internal/webui 供未来宿主分组使用）；删除 host.center locale 键；更新 registry 测试边（settings.center 顶级）与 e2e 断言（侧栏顶级 'Settings'，不再出现 'Management center'）；059 之 first() 保持（侧栏组：ops.dashboard + settings.center）。页内 SectionNav 两级内分区不变。"
