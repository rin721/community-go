  - id: webui
    decision: updated
    documents:
      - webui/README.md
    reason: openapi 模块回归后台设计语言（R075-006）：去除 Apifox 外观壳层（自定义资源树/标签条/命令面板观感/afx token/右侧响应栏），改为平台组件列表 + Drawer 详情（文档/调试） + 调试区响应卡片；业务能力保留（解析/执行/highlight/深链/Cmd+K/mock 禁用）；控件基座仍为 HeroUI；docs/development/webui.md 同步更新。
  - id: module
    decision: updated
    documents:
      - internal/module/README.md
    reason: openapi 模块（WebUI-only）重构为平台组件呈现（OpenAPIPage 列表/OperationDrawer/ModelDrawer/CommandPalette 等，删除 ApiTree/WorkspaceTabs/OperationPane/ResponsePanel），模块 README 更新；模块清单权威 internal/module/README.md 已同步。
  - id: startup
    decision: reviewed-no-change
    reason: 宿主 boot 装配链（manifest -> registry -> Shell -> route）、revision 门禁、托管构建链（webui generate 扩展为同一命令多产物）与 mock 传输层语义不变；openapi 页面零请求，三态数据源环境一致渲染。
  - id: operations
    decision: reviewed-no-change
    reason: 无新运行期资源、配置、端口或部署语义；自绘页面为懒加载独立 chunk（OpenAPIPage 从 ~1.37MB/387KB gzip 降至 ~46KB/6KB gzip，bundle 基线记录于 075 变更记录），不影响首屏与 release 装配。