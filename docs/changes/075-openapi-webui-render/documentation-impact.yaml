schema_version: 1
change: 075-openapi-webui-render
areas:
  - id: repository
    decision: reviewed-no-change
    reason: .scaffold/layout.json 仅新增 webui.specOutput 字段（既有路径集中声明机制不变）；repository 权威文档内容不变。
  - id: api
    decision: updated
    documents:
      - api/README.md
    reason: api/README.md 补充「浏览器契约快照」说明：webui generate 从 api/openapi.yaml 渲染 webui/src/generated/openapi-spec.ts（同一产物的 JSON 变换，非第二份权威），并将快照消费描述更新为「平台组件自绘只读参考页」；契约本体与 CI oasdiff 基线不变。
  - id: webui
    decision: updated
    documents:
      - webui/README.md
    reason: openapi 模块第六轮改为层级分类多页面（R075-007）：4 个静态路由（/openapi 总览、/openapi/tags 分类接口列表、/openapi/operation 文档/调试、/openapi/models 模型）共享 GroupLayout（073 范式）与 SectionNav 页内导航；详情 Drawer 撤壳升为页面，深链 ?tag=/?op=&mode=/?model= 跨页导航；业务能力保留（解析/执行/highlight/深链/Cmd+K/mock 禁用）；控件基座仍为 HeroUI；docs/development/webui.md 同步更新。
  - id: module
    decision: updated
    documents:
      - internal/module/README.md
    reason: openapi 模块（WebUI-only）第六轮重组为多页面层级（OpenAPILayout + 总览/分类/接口/模型四个页面，删除单页壳 OpenAPIPage 与 Drawer 外壳），模块 README 更新；模块清单权威 internal/module/README.md 已同步。
  - id: startup
    decision: reviewed-no-change
    reason: 宿主 boot 装配链（manifest -> registry -> Shell -> route）、revision 门禁、托管构建链（webui generate 扩展为同一命令多产物）与 mock 传输层语义不变；openapi 页面零请求，三态数据源环境一致渲染。
  - id: operations
    decision: reviewed-no-change
    reason: 无新运行期资源、配置、端口或部署语义；自绘页面为懒加载独立 chunk（OpenAPIPage 从 ~1.37MB/387KB gzip 降至 ~46KB/6KB gzip，bundle 基线记录于 075 变更记录），不影响首屏与 release 装配。