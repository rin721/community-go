schema_version: 1
id: R075-004
title: "Apifox 风格可测试 API 文档工作台（执行能力与视图结构）"
question: "用户要求『如 Apifox 这样、可测试、完整的 API 文档页面，而不是全都放到一个页面、没有完整功能的 Swagger UI』——页面需要操作树导航 + 详情 + 真实请求执行 + 响应展示，应如何设计视图与执行语义（含认证/CSRF/mock 边界），是否有可嵌入的成熟第三方？"
research_type: current-project
topics: ["API 文档工作台", "请求执行器", "Apifox", "视图结构", "自研边界"]
keywords: ["hoppscotch", "postman-like", "try-it-out", "csrf", "bearer token", "master-detail"]
applicable_scenarios:
  - "Admin WebUI 内需要『文档 + 测试』一体的 API 工作台（操作树 -> 详情 -> 执行 -> 响应）"
  - "执行请求必须复用当前用户会话语义（bearerAuth token / webuiSession Cookie + CSRF）"
non_applicable_scenarios:
  - "独立部署的完整 API 测试应用（hoppscotch/Postman/Bruno 等独立产品形态）"
  - "多环境/环境变量/脚本断言等 Apifox 高级工作流（无真实用例，成本不成比例）"
status: active
summary: "用户要求工作台化（操作树 + 详情 + 执行 + 响应）的可测试 API 文档，取代单页堆叠的只读参考页（R075-003 结论被取代）。无满足『平台组件 + 可嵌入 + 完整』的成熟第三方（hoppscotch 等为独立应用形态），在 openapi 模块内自建工作台：单 manifest 路由 + 模块内部视图状态（树/列表/详情/模型，search 参数深链）；执行器用同源 fetch（credentials include），bearerAuth 注入内存 token、webuiSession 自动携带会话 Cookie 与 CSRF（复用 loadSession 的 csrfToken + Origin）；mock 演示构建无后端时仅浏览。"
