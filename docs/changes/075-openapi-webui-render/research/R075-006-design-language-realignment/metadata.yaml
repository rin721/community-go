  - "Admin WebUI 内以平台设计语言承载 API 文档查看 + 在线调试（Try it out）"
  - "复用现有模块流程范式（列表 → 详情/弹层 → 表单 → 提交 → 反馈）"
non_applicable_scenarios:
  - "工具类软件工作台布局（资源树+右响应栏）原样嵌入后台"
  - "继续使用 Apifox 视觉 token/自定义壳层"
