title: "设计语言回归：提取 Apifox 业务能力，融入 Community Go 后台视觉（去外壳）"
question: "用户指出 openapi 模块当前的 Apifox 风格 UI 与整个后台系统（深色左侧导航、蓝色主调、圆角卡片、标准中后台表单/表格控件）严重脱节，像套用了陌生前端模板。要求：停止模仿 Apifox 的外壳，提取其业务能力（API 文档查看、在线调试 Try it out），用系统既有组件（表单/表格/弹窗/折叠面板）以贴合后台操作习惯的流程呈现；基于现有架构“微改造”而非“大换血”，去除偏离主题的设计。"
research_type: current-project
topics: ["设计语言回归", "平台组件", "微改造", "API 文档查看", "在线调试"]
