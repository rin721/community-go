title: "MFA/TOTP 技术选型：RFC 6238 标准、自研 vs 第三方、实施边界"
question: "MFA/TOTP 在既有本地账号体系内采用什么实现路径（RFC 6238 自研 vs 第三方库），与登录/会话/审计如何衔接，实施范围与先决条件是什么？"
research_type: current-project
topics: ["iam", "auth", "mfa", "totp", "rfc6238", "security"]
keywords: ["TOTP", "RFC6238", "HOTP", "AuthenticatorApp", "MFA", "RecoveryCode", "自研 vs 第三方"]
applicable_scenarios: ["本地账号 + 标准验证器的双因素增强", "与 077 口令治理互补的认证加固", "MFA 立项前置选型"]
non_applicable_scenarios: ["依赖短信/邮件的 OTP（需外部通道，候选）", "把 MFA 当作授权模型的一部分（只影响认证）", "未复核维护状态即引入第三方 OTP 库"]
status: active
summary: "TOTP 唯一权威依据为 RFC 6238/HOTP RFC 4226（HMAC-SHA1、30s、6 位、base32 secret、±1 窗口、防重放），RFC 6238 附录 B 官方向量可验证与应用互通；候选 pquerna/otp 成熟但本次 web 通道不可用、无法按 AGENTS 3.2 复核维护状态，不作为默认；推荐自研（标准库：crypto/hmac、crypto/sha1、crypto/rand、encoding/base32），零第三方依赖、边界可控、向量可测。登录两步（mfa_required + 一次性 challenge + mfa_verified 会话标记）、自助绑定/确认/解绑、恢复码、审计均沿既有边界设计；实施体量 M+，建议独立变更（079）承接，本报告为前置选型归档。"
