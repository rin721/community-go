schema_version: 1
id: R081-001
title: "运维监控可视化能力盘点：运行时仪表盘/时序报表图、进程与宿主监控的现状与路径"
question: "现有 Ops/observability 对（需求1）持久监听与输出的服务状态可视化、（需求2）服务器状态监控模块的现状与缺口是什么；时序报表数据、进程/宿主指标采集、前端图表取向如何选？"
research_type: current-project
topics: ["ops", "observability", "monitoring", "dashboard", "sparkline"]
keywords: ["RuntimeSnapshot", "Metrics", "NodeExporter", "SVGChart", "ServerMonitoring", "滚动窗口"]
applicable_scenarios: ["单进程自托管运行状态可视化", "进程级监控闭环（内存/goroutine/GC）", "基础时序报表图（请求/调度/消息趋势）", "node-exporter 宿主机指标接入指引"]
non_applicable_scenarios: ["多实例聚合监控", "Prometheus+Alertmanager 全链路（外部部署指引）", "复杂 BI 报表/图表缩放联动（触发图表库评估）", "durable metrics 存储"]
status: active
summary: "现状：已有 management probe/diagnostics/metrics（Prometheus text）与 WebUI Dashboard/Capabilities（快照卡片+metrics 数值解析，无时序）。缺口：无时序报表图、无进程/宿主监控（RuntimeSnapshot 缺内存/goroutine/GC/uptime，metrics 缺 runtime Gauge）、组件明细仅 scheduler/messaging health。采用：时序数据=前端滚动窗口轮询累积（零后端存储）；进程指标=标准库 runtime（跨平台零依赖），OS 级（CPU/磁盘/网络）=node-exporter 标准路径（文档指引；gopsutil 无法复核不作为默认）；图表=自研轻量 SVG chart 原语（webui/src/ui，延续自研 UI 原语方向，不引入 echarts/recharts）。工作量 M+。"
