status: active
summary: "HEAD 实测 6 个模块 CSS 共 137 处 :global(（auth 9 / iam 25 / navigation 15 / openapi 0 / ops 75 / organization 5 / settings 8），webui/src 及其余仓库零 :global；083 README 声称的 122 与实测不符（两个快照均为 137）；137 处中仅 ops.module.css 的 :global(.header-zone-action) 为无模块根前缀的真全局，其余全部以 .moduleRoot 前缀收口但仍使用裸类名/裸元素选择器（form-error/fieldset/dl 等），其中 auth audit-*（9）、iam session-*（7）、navigation policy-grid/policy-card（5）共 21 处为无 tsx 消费方的死代码；平台 .toolbar 在 iam/organization 移动断点被模块私有覆盖；openapi.module.css 零 :global 但以 camelCase 局部类（pageMeta/formHint/workspaceTabs）与平台 kebab-case 命名分裂。布局骨架：.app-shell grid 双列 + min-height 100vh（L263-269）、.app-sidebar min-height 100vh + overflow hidden（L273-284）、.app-workspace 第二定义 height 100vh + overflow hidden 固定（L474-478）、.topbar 64px（L480-488）、.workspace-tabs 44px（L742-749）、.page-viewport overflow auto + max-width var(--shell-content-max)=1600px 居中限宽（L820-828）；页面滚动发生在 .page-viewport 元素级（ScrollExperience panel 模式），window 不承担 app 布局滚动；全仓无 dvh 单位，11 处 100vh；main 滚动模型与 8 个 720px/900px/1000px/1050px/1100px 模块断点已列全；Tab Bar 由 AppShell.tsx 按 theme.layout.showTabs 装配（visitedRoutes 状态 + WorkspaceTabs.tsx），Footer 由 showFooter 装配并固定占用工作区底部；lint-architecture.mjs 与 lint-modules.mjs 均不检查 :global 泄漏、平台类重复、私有覆盖，现有 eslint 仅 ts/tsx 且只查 no-unused-vars，修复无 lint 守护缺口已确认。"
