title: "样式权威与布局骨架事实基线"
question: "083 方案 11b/11c 声称的样式污染（122 处 :global 泄漏、平台类被模块私有覆盖、camelCase 命名分裂）与布局骨架缺陷（100vh 固定工作区、居中限宽 max-width、滚动模型、Tab Bar、Footer）在 HEAD 5a3def3 的真实代码事实是什么？每项缺陷的修复需触及哪些文件与契约面，现有 lint 是否能守护？"
research_type: current-project
