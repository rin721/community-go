question: "082 已实施的每个页面（Accounts/Roles/Permissions/Sessions/ApiTokens/Audit/Departments/Menus/Dashboard/Settings/Login-Setup 约 11 个页面组）相对 docs/changes/admin-design-baseline.md（27 节后台产品设计风格基准）逐一对照后属于「达标 / 部分达标（差距清单）/ 旧结构沿用需重做」中的哪一档；每页 13 个固定设计维度（页面模板、Feature 化、DataTable、FilterBar、Detail、EntityHeader、MetricCard、StatusBadge、状态全集、危险确认、信息密度、Table 操作列、命名/样式污染）的逐项判定与代码证据；重做优先序与每页「重做 vs 保留+补齐」三档判定（大改/中改/小改）。"
