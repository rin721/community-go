status: active
summary: "11 个页面组×13 个固定维度共 143 项判定：有效判定 105 项中「达标」30 项（28.6%）、「部分达标」60 项（57.1%）、「需重做」15 项（14.3%）；没有任何页面整体达标（单页达标率最高 Login/Setup 60%，最低 ApiTokens 9.1%）。结构级维度（页面模板、Detail 模式、StatusBadge 一致性）普遍达标或部分达标，能力级缺口集中在：DataTable 排序（后端无 sort）与过滤接线（accounts/sessions 后端已有 typed filter 未 surface）、Audit 无分页（只看前 50 条）、时间戳 raw 呈现（Sessions 4 列/Audit）、EmptyState/Loading 组件化（5 页 DataTable 空态为 page-meta 段落）、危险操作缺确认（archive/revoke）、Table 操作列违反「1 主操作+…」折叠（ApiTokens 4 按钮内联）、业务组件缺失（MetricCard/EntityHeader/ActivityTimeline）、以及 6 模块 137 处 :global 样式污染逐页存量。重做优先序：P0 样式权威清理与骨架宽度接线（全部页）→ P1 Audit 分页、时间戳格式化、Settings 双导航收敛 → P2 FilterBar 接线与后端 sort → P3 MetricCard/EntityHeader 组件化与操作列折叠 → P4 危险确认与空载态 → P5 Feature 拆解。"
