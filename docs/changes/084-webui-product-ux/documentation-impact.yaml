    reason: 逐页推翻低质量布局：组织三页改为取景区+详情编辑区（部门搜索树+编辑/归档、岗位名录表格+行菜单、账号两栏分配）；Menus 修复右栏截断并跨 namespace 翻译标题；OpenAPI 首访默认选中+可操作空态；权限目录描述解析修复（新增 permission.* 双语键）；Settings 开关行/单选组重构；密码表单补确认字段与分组；ApiTokens 创建表单分组。084b：登录/初始化页产品化；Accounts 角色筛选；Sessions/Accounts/Roles/ApiTokens 排序并入 FilterBar；Sessions 批量条常驻。084c：mock 数据量提升至真实规模作密度基线；DataTable rowMenuHeader 操作列可见表头；角色类型列头；审计操作列截断；API 令牌创建表单触达后必填提示与权限分组全选。084d：会话按账号过滤（对齐后端 accountId 契约）；仪表盘健康行状态单元；技术栈两列 chip 与仓库链接。084f：FilterBar trailingFields 右侧排序簇；行操作列固定宽度与主操作/「更多」chip 边界；BulkActionBar 未选择时降为次级视觉并取消 sticky 遮挡。084g：审计筛选并入列表卡；仪表盘指标快照前置与统计/指标块高度压缩；CodeText 复制按钮 chip。084h：全 24 路由严格可用性终审后修复 Select 指示器错位锚定（trigger 内 chevron）与语言单选组默认选中。模块开发指南同步 FilterBar/行操作约定。改动文件：organization/navigation/openapi/iam/settings/auth 的 binding/webui/web/*。
