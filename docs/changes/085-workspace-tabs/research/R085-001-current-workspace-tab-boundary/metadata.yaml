status: active
summary: "HEAD a60de23 的 AppShell 只有单 Outlet，083 已在 6c7bd338 删除 visited-route Tab Bar；旧实现按所有访问 route 自动增长且缺少固定、恢复、关闭其他、溢出、dirty、持久化和上限。当前 Route/ManifestRoute 无工作上下文资格字段，但残留 13 条 workspace-tab 样式规则、workspace-tabs zone 与滚动注释。085 应通过默认禁用的 typed WorkspaceTabPolicy 显式 opt-in，以 routeID/contextID 形成稳定去重键；宿主以最多 12 个 mounted panels 保住未保存内存状态，模块经窄生命周期契约报告 dirty/active，关闭与 beforeunload 统一保护；localStorage 只保存版本化、按 principal 隔离的低敏标签元数据，不保存表单草稿、凭据、任意 query 或 dirty。WAI-ARIA APG 支持 tablist/tab/tabpanel、roving focus、方向键、Home/End、Delete 和上下文菜单语义。"
