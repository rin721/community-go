title: "Workspace Tabs 当前边界与可实施性"
question: "当前 WebUI 是否仍有全局标签能力；旧 visited-route 标签为何不能直接恢复；只让独立工作上下文生成标签时，需要补齐哪些 route、宿主状态、未保存保护、持久化、可访问性与数量边界？"
