schema_version: 1
id: R087-001
title: "Settings 页内导航与自动 Workspace mounted panel 冲突"
question: "为什么 Settings 分区点击出现无响应或生硬加载，并可能在点击后回到带筛选条件的 Accounts URL；当前自动页面标签模型是否仍适合普通列表页和分组设置页？"
research_type: current-project
topics: ["webui", "settings", "workspace-tabs", "mounted-panels", "react-router", "query-state", "section-nav"]
keywords: ["settings.layout", "SectionNav", "WorkspaceOutlet", "openWorkspace", "activateAndNavigate", "useSearchParams", "admin/accounts", "groupLayoutId"]
applicable_scenarios:
  - "Settings 八分区页内 SPA 导航"
  - "普通列表页与带 query URL 的 workspace 隔离"
  - "自动页面标签资格与 mounted panel 边界修正"
non_applicable_scenarios:
  - "IAM Accounts 筛选字段或服务端列表 API 改造"
  - "数据库、账号数据、权限或 migration 变更"
status: active
summary: "当前 085 Rev.2 对所有正式 app route 自动 openWorkspace，使 Settings 八分区各自成为固定 location 的 mounted panel，直接覆盖 073 的共享固定布局不变量；Accounts 也常驻并保存内存 location，标签激活会精确重放 pathname+search。源码未发现任意 body click 或 history.back 监听，当前 8080 又不可用，因此任意位置误触的具体 hit target 尚需带认证运行态测试确认。推荐恢复显式 WorkspaceTabPolicy：普通 Settings/Accounts 默认 disabled，走单 Router Outlet；仅真实独立工作台 opt-in mounted workspace。"
